<meta charset="utf-8">
<script>/* ?reset: drop the offline cache and service worker (answers in localStorage stay), then reload clean */
if(/[?&]reset\b/.test(location.search) && "serviceWorker" in navigator){
  Promise.all([navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))), self.caches?caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))):0])
    .finally(()=>location.replace(location.pathname+location.hash));
}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140B10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>Профиль желаний</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Design: docs/design-guide.md. One dark "velvet" theme; chat for getting acquainted and chapter breaks, cards for yes/maybe/no, big buttons for 1–5 */
:root{
  --bg:#140B10; --surface:#22151C; --surface-2:#2A1B23; --fg:#F6E9EE; --muted:#B39CA7; --line:#3A2A32;
  --accent:#E3789D; --accent-ink:#2A0E19; --yes-bg:rgba(227,120,157,.16);
  --maybe:#E3B25A; --maybe-bg:rgba(227,178,90,.14); --no:#A0959A; --no-bg:#2E2529;
  --card-grad:linear-gradient(160deg,#F7C6D6 0%,#E3789D 55%,#B9456E 100%);
  --cta-grad:linear-gradient(180deg,#F08DB0,#D9608B);
  --display:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:radial-gradient(120% 50% at 85% -10%,#5A1F38 0%,rgba(90,31,56,0) 60%),radial-gradient(90% 45% at -10% 105%,#3B1530 0%,rgba(59,21,48,0) 60%),var(--bg);background-attachment:fixed;
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:600;font-size:clamp(48px,14vw,64px);line-height:.92;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;color:var(--accent);display:block}
h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05}
h2 em{font-style:italic;font-weight:500;color:var(--accent)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600}
p{margin:0;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:grid;gap:14px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:20px;display:grid;gap:14px;min-width:0}
.note{font-size:14px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.flag{background:var(--maybe-bg);color:var(--fg);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.flag b{color:var(--maybe)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{min-height:50px;background:var(--cta-grad);color:var(--accent-ink);padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 10px 28px -10px rgba(227,120,157,.6)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.link{display:inline-flex;align-items:center;min-height:44px;background:none;color:var(--accent);padding:4px 0;font-weight:500;text-decoration:underline;text-underline-offset:3px;box-shadow:none;border-radius:0}
.btn.wide{width:100%;min-height:56px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:space-between}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:linear-gradient(var(--bg) 75%,rgba(20,11,16,0));padding-block:10px 12px;display:grid;gap:6px;margin-bottom:-6px}
.bar .row{justify-content:space-between;font-size:13px;color:var(--muted);flex-wrap:nowrap}
.bar .lbl{flex:1;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:3px;background:#3E2A34;border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .25s}
.bar .stop{min-height:44px;font-size:13px;color:var(--muted);padding:0 2px}
.bar .back{min-height:44px;font-size:14px;color:var(--fg);padding:0 2px}
header.screen{padding-top:18px;display:grid;gap:10px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600}
/* question rows (settings, modules) */
.list{display:grid}
.item{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .q{font-weight:500}
.item .hint{font-size:14px;color:var(--muted)}
.item.skipped .q{color:var(--muted)}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:64px;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button.m[aria-pressed="true"]{background:var(--maybe-bg);border-color:var(--maybe);color:var(--maybe)}
.seg button.n[aria-pressed="true"],.seg button.na[aria-pressed="true"]{background:var(--no-bg);border-color:var(--no);color:var(--fg)}
.lik{display:grid;gap:4px}
.lik .seg{flex-wrap:nowrap}
.lik .seg button{min-width:0;width:44px;padding:8px 0;font-variant-numeric:tabular-nums}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);width:244px;max-width:100%}
.skip{min-height:44px;font-size:14px;color:var(--muted);padding:6px 8px;text-decoration:underline;text-underline-offset:3px}
.skip[aria-pressed="true"]{color:var(--fg);text-decoration:none;background:var(--no-bg);border-radius:999px;padding:6px 12px}
/* choice chips */
.field{display:grid;gap:10px}
.field>.q{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid #4A2F3B;background:#1E1218;font-size:15px;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip .soon{font-size:12px;color:var(--muted);margin-left:6px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
textarea{min-height:120px;font-size:13px;word-break:break-all}
.check{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:14px 16px;border:1px solid rgba(255,255,255,.07);border-radius:18px;background:rgba(255,255,255,.04);text-align:left}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.check[aria-checked="true"]{border-color:rgba(227,120,157,.5)}
.check[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] .box::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-top:8px}
/* welcome */
.hero{padding-top:44px;display:grid;gap:18px}
.hero .lead{font-size:17px;color:#E2CDD5}
.facts{display:grid;gap:12px}
.fact{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:#D7C0C9}
.fact i{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:rgba(227,120,157,.16);color:var(--accent);font-style:normal;font-size:13px;font-weight:700}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.45}
.msg.in{background:var(--surface);border-bottom-left-radius:6px;align-self:flex-start}
.msg.in .muted{font-size:13px}
.msg.out{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;align-self:flex-end;font-weight:500;text-align:right}
.msg.out.skipped{background:var(--no-bg);color:var(--muted)}
.msg.title{background:none;padding:8px 2px 2px;font-family:var(--display);font-size:32px;line-height:1.05;font-weight:600;max-width:100%}
.msg.title em{color:var(--accent);font-style:italic;font-weight:500}
.msg.new{animation:pop .35s ease both}
.msg.new:nth-of-type(2){animation-delay:.12s}.msg.new:nth-of-type(3){animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dock{position:sticky;bottom:0;z-index:4;padding:12px 0 calc(10px + env(safe-area-inset-bottom, 0px));background:linear-gradient(rgba(20,11,16,0),var(--bg) 22%);display:grid;gap:10px}
.dock .chips{justify-content:flex-end}
.dock .row{justify-content:flex-end}
.dock input{border-radius:999px}
/* one question per screen */
.qpage{display:flex;flex-direction:column;gap:14px;min-height:calc(100svh - 90px)}
.qmeta{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.qmeta span:last-child{color:var(--muted);letter-spacing:.04em}
.lq{font-family:var(--display);font-size:clamp(30px,8.6vw,38px);line-height:1.05;font-weight:600}
.qhint{font-size:14px;color:var(--muted)}
.scale{display:grid;gap:8px;margin-top:auto}
.opt{min-height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:14px;padding:0 18px;text-align:left;font-size:15px;transition:background .15s,border-color .15s}
.opt .n{font-family:var(--display);font-size:24px;width:16px;color:#9C8090;line-height:1}
.opt[aria-checked="true"]{background:rgba(227,120,157,.2);border-color:var(--accent)}
.opt[aria-checked="true"] .n{color:var(--accent)}
.opt.na{justify-content:center;font-size:14px;color:var(--muted);min-height:46px}
.opt.na[aria-checked="true"]{color:var(--fg);background:var(--no-bg);border-color:var(--no)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qfoot button{min-height:44px;font-size:14px;color:var(--muted)}
/* cards */
.deck{position:relative;flex:1;min-height:300px;max-height:440px;margin:6px 6px 0}
.qcard{position:absolute;inset:0;border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.qcard.b1{transform:translateY(16px) scale(.92);background:#3A1A29;opacity:.7}
.qcard.b2{transform:translateY(8px) scale(.96);background:#5A2840;opacity:.85}
.qcard.front{background:var(--card-grad);color:var(--accent-ink);box-shadow:0 24px 40px -18px rgba(0,0,0,.85);transition:transform .28s ease,opacity .28s ease;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.qcard.front.drag{transition:none}
.qcard .suit{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;opacity:.75}
.qcard .cq{font-family:var(--display);font-size:clamp(30px,8.6vw,36px);line-height:1.04;font-weight:700;margin-top:auto}
.qcard .sub{font-size:14px;opacity:.85}
.stamp{position:absolute;top:64px;border:3px solid var(--accent-ink);color:var(--accent-ink);font-weight:800;font-size:17px;letter-spacing:.12em;padding:2px 10px;border-radius:8px;opacity:0;text-transform:uppercase}
.stamp.y{right:18px;transform:rotate(12deg)} .stamp.n{left:18px;transform:rotate(-12deg)} .stamp.m{left:50%;top:44px;transform:translateX(-50%)}
.stamp.on{opacity:.85}
.acts{display:flex;justify-content:space-around;align-items:center;padding-top:6px}
.act{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--muted);min-width:64px}
.act i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:21px;font-weight:700;border:1.5px solid #4A2F3B;background:#22121A}
.act.y i{width:68px;height:68px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:26px}
.act.m i{color:var(--maybe);border-color:#5A4320}
.act[aria-pressed="true"]{color:var(--fg);font-weight:600}
.act.n[aria-pressed="true"] i{border-color:var(--fg)}
.act.m[aria-pressed="true"] i{background:var(--maybe-bg);border-color:var(--maybe)}
.act.y[aria-pressed="true"] i{box-shadow:0 0 0 4px rgba(227,120,157,.3)}
.swipehint{font-size:12px;color:var(--muted);text-align:center}
/* result */
.res h2{font-size:30px}
.big{font-family:var(--display);font-size:26px;line-height:1.2;font-weight:500}
.acc{display:grid;gap:10px}
.acc .a{display:grid;gap:4px;padding:12px 14px;border-radius:16px;background:var(--yes-bg)}
.acc .a b{color:var(--accent)}
.meters{display:grid;gap:10px}
.meter{display:grid;grid-template-columns:minmax(0,9em) 1fr 2.6em;gap:10px;align-items:center;font-size:14px}
.meter .t{height:8px;border-radius:8px;background:#2E1F27;overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--accent);border-radius:8px}
.meter .t.mut i{background:var(--maybe)}
.meter .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.axes{display:grid;gap:16px}
.axis{display:grid;gap:4px}
.axis .nm{font-size:14px;font-weight:600}
.axis .line{position:relative;height:6px;border-radius:6px;background:#2E1F27}
.axis .line::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.axis .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(227,120,157,.25)}
.axis .poles{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.groups{display:grid;gap:12px}
.groups .g{display:grid;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:14px;padding:5px 12px;border-radius:999px}
.pill.y{background:var(--yes-bg);color:#F6C4D5} .pill.m{background:var(--maybe-bg);color:#F0CF8E}
.mods{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mod{border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;display:grid;gap:4px;background:rgba(255,255,255,.03)}
.mod b{font-weight:600}
.tips{margin:0;padding-left:1.2em;display:grid;gap:4px}
.brk{display:grid;gap:6px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:#1A0F14;padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;max-width:90%}
.steps-list{display:grid;gap:6px}
.steps-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.04);text-align:left}
.pin{display:flex;gap:10px;align-items:center}
.pin input{max-width:10em;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.cols{display:grid;gap:10px;width:100%}
.col{display:grid;gap:4px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
/* modules one per screen */
.qone .item{padding:0;border:0}
.qone .item>.q,.qone .item>.hint{display:none}
.qone .ans{display:grid;gap:10px}
.qone .seg{display:grid;gap:8px}
.qone .seg button{min-height:52px;border-radius:16px;text-align:left;padding:0 18px;font-size:15px;width:100%}
.qone .cols .seg{grid-template-columns:repeat(3,1fr)}
.qone .cols .seg button{text-align:center;padding:0 6px}
.qone .col{gap:8px}
.qone .col>.small{font-size:14px;color:var(--fg)}
.qone .skip{display:none}
/* stories */
.story{min-height:calc(100svh - 20px);display:flex;flex-direction:column;gap:14px;padding-top:14px;position:relative}
.story .bars{display:flex;gap:4px}
.story .bars i{flex:1;height:3px;border-radius:2px;background:#3A2A32}
.story .bars i.on{background:var(--fg)}
.story .slide{flex:1;display:flex;flex-direction:column;gap:16px;position:relative;z-index:2;pointer-events:none}
.story .slide button,.story .slide summary{pointer-events:auto}
.story h2{font-size:clamp(38px,11vw,48px);line-height:.98}
.story .slide>p{font-size:16px;color:#E2CDD5}
.story .gauges{display:grid;gap:14px;margin-top:auto}
.story .g{display:grid;gap:6px}
.story .g .l{display:flex;justify-content:space-between;font-size:14px;color:#D1BCC5}
.story .g .t{height:12px;border-radius:6px;background:#2E1F27;overflow:hidden}
.story .g .t i{display:block;height:100%;border-radius:6px}
.story .disc{font-size:12px;color:var(--muted)}
.story .fine{font-size:12px;color:var(--muted);text-align:center;position:relative;z-index:2}
.tapzones{position:absolute;inset:40px 0 0;display:grid;grid-template-columns:30% 70%;z-index:1}
.tapzones button{min-height:100%}
.tapzones button:focus-visible{outline-offset:-4px}
/* pair */
.pairhero{display:grid;gap:2px;justify-items:center;text-align:center;padding:10px 0 4px}
.pairhero b{font-family:var(--display);font-size:72px;line-height:1;font-weight:600;color:var(--accent)}
.pairhero span{font-size:15px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

  "w.hide_hint": "Отмеченное не появится ни в откровенных вопросах, ни в списке тем, ни в идеях. Передумать можно в настройках.",
  "i.title": "Как это устроено",
  "i.lead": "Три части, от простого к личному. Темп задаёшь ты.",
  "i.s1.t": "1. Знакомство",
  "i.s1": "Как к тебе обращаться, что учесть про тело, кто тебя привлекает и какие у тебя отношения. Чтобы дальше вопросы звучали так, будто написаны для тебя.",
  "i.s2.t": "2. Главное",
  "i.s2": "Что тебя заводит, что сбивает настрой и какой стиль тебе ближе. Без подробностей про практики, минут 8. В награду — твой профиль.",
  "i.s3.t": "3. Откровенное — по желанию",
  "i.s3": "Открывается после профиля, и только если захочешь. Темы, которые не хочется видеть, можно скрыть заранее.",
  "i.skip": "Правил всего два: любой вопрос можно пропустить, а остановиться — в любой момент. Кнопка «Хватит на сегодня» сохранит ответы.",
  "i.hard": "Если тема задевает тяжёлый опыт, её можно пропустить или скрыть. Объяснять ничего не нужно.",
  "w.start": "Поехали",
  "w.continue": "Продолжить",
  "w.back_again": "С возвращением! Ответы на месте, продолжим с того же места.",

  "t.title": "Прежде чем начать",
  "t.lead": "Тема взрослая, данные личные, поэтому без этих отметок игра не начнётся и ничего не сохранится.",
  "t.age": "Мне исполнилось 18 лет",
  "t.terms": "Принимаю условия использования",
  "t.terms_hint": "Это ранняя версия условий. Как мы обращаемся с данными — в разделе «Условия и конфиденциальность».",
  "t.data": "Даю согласие на обработку моих ответов о сексуальной жизни, теле и ориентации на этом устройстве, чтобы получить результат",
  "t.data_hint": "Это данные особой категории (GDPR, ст. 9). Ответы не уходят с устройства: уходит только то, что ты скопируешь и отправишь своими руками, например код для партнёра. Отозвать согласие можно в настройках: «Удалить все ответы».",
  "t.read": "Прочитать условия и политику конфиденциальности",
  "t.diag": "Понимаю: результат — самооценка, а не диагноз и не медицинский совет. И всё, о чём здесь речь, — только по взаимному согласию",
  "t.under": "Мне нет 18",
  "u.title": "Эта игра только для взрослых",
  "u.text": "Здесь ничего не сохраняется. Если хочется разобраться в отношениях, теле или чувствах, можно поговорить со взрослым, которому доверяешь, или со школьным психологом.",
  "u.saved": "На этом устройстве уже есть ответы. Стереть их можно в настройках: «Удалить все ответы».",
  "u.back": "Назад к условиям",
  "doc.title": "Условия и конфиденциальность",
  "doc.draft": "Черновик для ранней версии приложения, редакция 2026-11.2. Текст подготовил и проверил агент-юрист, а не юрист: перед публичным запуском его проверит юрист.",
  "doc.what.t": "Что это",
  "doc.what": "«Профиль желаний» — анкета для взрослых о близости и желаниях. Она бесплатная и работает как есть: это ранний прототип, вопросы и функции могут меняться. Результат помогает лучше понять себя и начать разговор с партнёром.",
  "doc.notmed.t": "Не медицинская услуга",
  "doc.notmed": "Результат — самооценка, а не диагноз и не медицинский совет. Приложение не ставит диагнозы, не лечит и не заменяет врача, сексолога или психолога. Это описание по твоим ответам, а не решение о тебе: автоматически ничего не решается и ни на что не влияет. Если что-то болит или тревожит, это стоит обсудить с врачом.",
  "doc.rules.t": "Правила",
  "doc.rules": "Пользоваться приложением можно только с 18 лет. Всё, о чём говорит анкета, — только для взрослых и только по взаимному согласию. Код профиля, запрос для ИИ-чата и приглашение ты передаёшь своими руками: кому их отправить, решаешь ты.",
  "doc.who.t": "Кто отвечает",
  "doc.who": "Приложение делает разработчик «Профиля желаний». Имя или название компании и адрес появятся здесь до публичного запуска. Пока всё хранится на твоём устройстве, твои ответы к нам не попадают: мы их не видим, не храним и не можем прочитать.",
  "doc.data.t": "Какие данные и зачем",
  "doc.data": "Ответы анкеты: что нравится, что мешает, тело, ориентация, формат отношений; по желанию — имя или псевдоним и имя партнёра; настройки вроде скрытых тем и PIN. Если партнёр прислал свой код, на устройстве хранится и то, чем он поделился для игры вдвоём и угадайки. Ответы — данные особой категории (GDPR, ст. 9). Нужны они только для одного: показать профиль и совпадения здесь, на устройстве.",
  "doc.consent.t": "Твоё согласие",
  "doc.consent": "Ответы о сексуальной жизни обрабатываются только с твоего явного согласия (GDPR, ст. 9(2)(a)). Это отдельная отметка среди условий перед началом игры. Без неё анкета не откроется, других последствий отказ не несёт. Отозвать согласие можно в любой момент: «Удалить все ответы» в настройках стирает профиль с устройства.",
  "doc.where.t": "Где хранятся и сколько",
  "doc.where": "Только на этом устройстве, в памяти браузера, пока ты их не удалишь или не очистишь браузер. Ответы никуда не отправляются, аналитики нет, сторонние сервисы приложение не вызывает. Сервер, с которого загружается приложение, видит обычные данные загрузки, например IP-адрес, но не ответы. PIN закрывает вход, но ответы не шифрует.",
  "doc.share.t": "Что может уйти с устройства",
  "doc.share": "Только то, что копируешь своими руками: код профиля (в нём все ответы, имя или псевдоним и скрытые темы), код для партнёра (технически из него читается всё, что в нём перечислено, включая ответы для ответной угадайки, если ты их добавишь), ссылка-приглашение (выбранные тобой ответы для угадайки, без имён), план (совпадения и то, что важно партнёру после), запрос для ИИ-чата (сводка без имён). Скопированное проходит через буфер обмена и попадает туда, куда ты это вставишь, а ИИ-чат обрабатывает запрос по своим правилам.",
  "doc.rights.t": "Твои права",
  "doc.rights": "Все ответы и настройки видны в настройках, в разделе «Все ответы одним файлом», а забрать их можно кодом профиля. Имя партнёра хранится отдельно, его видно и можно стереть в разделе «Твои отношения»; данные партнёра стираются кнопкой «Удалить данные партнёра» на экране «Ваши совпадения» (в настройках — кнопка «Игра вдвоём»). Исправить ответы можно в любой момент, удалить всё — кнопкой «Удалить все ответы».",
  "doc.complaint.t": "Если что-то не так",
  "doc.complaint": "Если считаешь, что с твоими данными обошлись не по закону, можно пожаловаться в надзорный орган по защите данных своей страны. В Польше это UODO (Urząd Ochrony Danych Osobowych).",
  "doc.liability.t": "Ответственность",
  "doc.liability": "Мы делаем приложение бережно, но не обещаем, что оно всегда работает без сбоев. Сохраняй код профиля: если браузер очистится, без кода ответы не восстановить. Эти условия не ограничивают ответственность там, где закон не позволяет её ограничить, и не отменяют твоих прав потребителя.",
  "doc.changes.t": "Изменения",
  "doc.changes": "Если условия изменятся по сути, приложение снова покажет условия и спросит согласие заново. Какое право применяется и где решаются споры, определим до запуска; права, которые даёт тебе закон твоей страны, сохраняются.",
  "doc.contact.t": "Контакты",
  "doc.contact": "Адрес для вопросов о данных и условиях появится до публичного запуска. Пока всё хранится только на твоём устройстве, мы не можем ни показать, ни удалить твои данные за тебя: всё это делается в настройках.",
  "doc.back": "Назад",

// swipe on the card: right yes, left no, up maybe; buttons and arrow keys do the same
function bindCard(){
  const card = document.getElementById("qcard"); if(!card) return;
  const pick = val => { const b = app.querySelector(`.act[data-val="${val}"]`); if(!b) return;
    const dx = val===2?1:val===0?-1:0;
    card.style.transform = `translate(${dx*window.innerWidth}px,${dx?0:-window.innerHeight}px) rotate(${dx*18}deg)`; card.style.opacity = 0;
    setTimeout(()=>b.click(), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 220); };
  card._pick = pick;
  let x0=0, y0=0, dx=0, dy=0, on=false;
  const stamps = k => card.querySelector(`[data-stamp="${k}"]`);
  card.addEventListener("pointerdown", e=>{ on=true; x0=e.clientX; y0=e.clientY; dx=dy=0; card.classList.add("drag"); card.setPointerCapture(e.pointerId); });
  card.addEventListener("pointermove", e=>{ if(!on) return; dx=e.clientX-x0; dy=e.clientY-y0;
    card.style.transform = `translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    stamps("y").style.opacity = Math.max(0,Math.min(1,dx/90)); stamps("n").style.opacity = Math.max(0,Math.min(1,-dx/90));
    stamps("m").style.opacity = Math.abs(dx)<60 ? Math.max(0,Math.min(1,-dy/90)) : 0; });
  const end = ()=>{ if(!on) return; on=false; card.classList.remove("drag");
    if(dx>90) return pick(2); if(dx<-90) return pick(0); if(dy<-90 && Math.abs(dx)<60) return pick(1);
    card.style.transform=""; ["y","n","m"].forEach(k=>stamps(k).style.opacity=""); };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}
document.addEventListener("keydown", e=>{
  const card = document.getElementById("qcard"); if(!card || e.target.closest("input,textarea")) return;
  const val = {ArrowRight:2, ArrowLeft:0, ArrowUp:1}[e.key]; if(val==null) return;
  e.preventDefault(); card._pick?.(val);
});

/* ---------- result ---------- */
function yesMaybe(){
  const out = {};
  for(const id of [...CORE_IDS, ...EXTRA_IDS]){ const w=WMAP[id]; if(!w || !itemVisible(id)) continue; const v=P.answers[id];
    if(v===2||v===1){ (out[w.mod] ||= {y:[],m:[]})[v===2?"y":"m"].push(id); } }
  return out;
}
function recommendModules(){
  const score = Object.fromEntries(MODS.map(m=>[m,0])), seen = Object.fromEntries(MODS.map(m=>[m,0]));
  for(const [id,w] of Object.entries(WMAP)){ if(!itemVisible(id)) continue; const v=P.answers[id]; if(typeof v!=="number") continue; seen[w.mod]++; score[w.mod]+= v===2?1:v===1?0.6:0; }
  const explicitDone = !!P.modules.core_explicit;
  const topicHidden = m => P.settings.hidden_topics.includes(m);
  const allowed = m => !topicHidden(m) && (MOD_LVL[m]<3 || (explicitDone && score[m]>0));   // R11
  const rec = MODS.filter(m=>allowed(m) && score[m]>0).sort((a,b)=>score[b]-score[a] || MODS.indexOf(a)-MODS.indexOf(b));
  for(const m of MODS) if(rec.length<3 && allowed(m) && !rec.includes(m) && seen[m]===0 && MOD_LVL[m]<3) rec.push(m);
  const top = rec.slice(0,3);
  const later = MODS.filter(m=>!top.includes(m) && seen[m]>0 && score[m]===0 && !topicHidden(m));   // R10: all "No" go to the end, not hidden
  return {top, later};
}
function hintBox(key){
  if(P.settings.dismissed_hints.includes(key)) return "";

function cleanProfile(obj){
  if(!obj || typeof obj!=="object" || obj.schema!=="wp-profile/1") throw new Error("schema");
  const base = newProfile();
  const plain = v => v && typeof v==="object" && !Array.isArray(v);
  const strArr = v => Array.isArray(v) && v.every(x=>typeof x==="string");
  for(const sec of ["consent","identity","body","orientation","relationship","share_prefs"]){
    const src = obj[sec]; if(src==null) continue; if(!plain(src)) throw new Error(sec);
    for(const [k,def] of Object.entries(base[sec])){
      if(!(k in src)) continue;
      const v = src[k];
      const ok = Array.isArray(def) ? strArr(v) : def===null ? (v===null || typeof v==="string") : typeof v===typeof def;
      if(!ok) throw new Error(sec+"."+k);
      base[sec][k] = v;
    }
  }
  const ans = obj.answers ?? {}; if(!plain(ans)) throw new Error("answers");
  for(const [k,v] of Object.entries(ans)){
    if(!validAnswer(k, v)) throw new Error(k);
    base.answers[k] = v;
  }
  const mods = obj.modules ?? {}; if(!plain(mods)) throw new Error("modules");
  for(const [k,v] of Object.entries(mods)) if(plain(v) && (MODS.includes(k) || ["core","core_explicit"].includes(k))) base.modules[k] = {gate:["open","peek","skip"].includes(v.gate)?v.gate:undefined, done:v.done===true, at:typeof v.at==="string"?v.at:null};
  const ht = obj.settings?.hidden_topics; if(ht!=null){ if(!strArr(ht)) throw new Error("hidden_topics"); base.settings.hidden_topics = ht; }
  return base;
}

/* ---------- PIN (lock only, answers stay unencrypted) ---------- */
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+":"+pin);
  try{ const d = await crypto.subtle.digest("SHA-256", data); return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for(const c of data) h=(h*31+c)|0; return "w"+h; }
}

/* ---------- module logic: conditions R3–R5, R7, R14–R16 ---------- */
function anatKnown(){ return P.body.anatomy.length>0 && !P.body.undisclosed; }
function meHas(x){
  if(x==="strap"){ const v=P.answers["toys.strap"]; return !!(v && v.give>0); }
  return !anatKnown() || P.body.anatomy.includes(x);                                              // R3
}
function paHas(x){ const pa=P.orientation.partner_anatomy; return !pa.length || pa.includes("varies") || pa.includes("undisclosed") || pa.includes(x); }   // R4
function condOk(c){
  if(!c) return true;
  return c.split("|").some(tok=>{ const [k,v]=tok.includes(":")?tok.split(":"):["me",tok];
    return k==="me" ? meHas(v) : k==="pa" ? paHas(v) : k==="anat" ? (v==="known")===anatKnown() : true; });
}
function stopSet(){                                                                                   // R5: 2.2 plus «Нельзя» in zones
  const s = new Set(P.body.stop_zones.filter(z=>z!=="none"));
  for(const it of MODULES.zones) if(it.bz && it.bz!=="genitals" && P.answers[it.id]===0) s.add(it.bz);
  const gen = MODULES.zones.filter(it=>it.bz==="genitals" && condOk(it.c) && typeof P.answers[it.id]==="number");
  if(gen.length && gen.every(it=>P.answers[it.id]===0)) s.add("genitals");
  return s;
}
const hitsStop = (zs, st) => (zs||[]).some(z=>st.has(z));
function colOk(it, side, st){ return condOk(side==="a"?it.ca:it.cb) && !hitsStop(side==="a"?it.za:it.zb, st); }
const posAns = v => v===1 || v===2;
function anyYes(id){ const v=P.answers[id]; return v && typeof v==="object" && !Array.isArray(v) ? posAns(v.give)||posAns(v.get) : posAns(v); }
function poseRoleOptions(){
  const pen = meHas("penis") || meHas("strap"), rec = meHas("vagina") || (!modTopicHidden("anal") && !!(P.answers["anal.sex"]?.get>0)) || !anatKnown();
  return {pen, rec};
}
function poseRole(){
  const {pen, rec} = poseRoleOptions();
  if(pen && rec) return P.answers["poses.role"] || "both";                                          // not asked yet (e.g. anal.sex answered later)
  return pen ? "pen" : rec ? "rec" : "none";                                                       // R16: one role → not asked
}
function modItemVisible(it, st=stopSet()){
  if(it.c && !condOk(it.c)) return false;
  if(hitsStop(it.z, st)) return false;
  if(it.latex && P.body.latex_allergy==="yes") return false;                                        // R7
  if(it.preg && P.body.limits.includes("pregnancy")) return false;
  if(it.t==="yn2") return colOk(it,"a",st) || colOk(it,"b",st);
  if(it.p) return posAns(P.answers[it.mod+"."+it.p]);                                               // R15
  if(it.t==="lvl") return it.g.some(s=>{ const g=ITEM[it.mod+"."+s]; return g && modItemVisible(g,st) && anyYes(g.id); });   // R14
  if(it.id==="poses.role"){ const o=poseRoleOptions(); return o.pen && o.rec; }
  if(it.t==="pose"){ const r=poseRole(); if(r==="none") return it.nr; }
  return true;
}
function modTopicHidden(m){ return P.settings.hidden_topics.includes(m); }
function modItems(m){
  const st = stopSet();
  let list = MODULES[m].filter(it=>modItemVisible(it,st));
  if(m==="intens" && P.modules.power?.gate!=="open" && !(P.modules.power?.done)) list = [ITEM["power.stopword"], ...list];   // spec 10.12
  if(m==="poses"){                                                                                  // R6: gentle up, flagged down
    const lim = P.body.limits.filter(l=>l!=="none");
    if(lim.length){
      const flagOf = {knees:"knees", back:"back", standing:"stand"};
      const mine = lim.map(l=>flagOf[l]).filter(Boolean);
      const rank = it => it.t!=="pose" ? -2 : it.gentle ? -1 : it.f.some(f=>mine.includes(f)) ? 1 : 0;
      list = list.map((it,i)=>[it,i]).sort((a,b)=>rank(a[0])-rank(b[0]) || a[1]-b[1]).map(x=>x[0]);
    }
  }
  return list;
}
function modAnswered(m){ return modItems(m).filter(it=>it.id in P.answers).length; }
function modState(m){ const s=P.modules[m]; return !s ? "new" : s.gate==="skip" ? "skip" : s.done ? "done" : "started"; }
const PAGE = 8;
function modPages(m){
  const items = modItems(m);
  const peek = P.modules[m]?.gate==="peek" && !UI.peekMore?.[m];
  if(peek) return [items.slice(0,5)];                                                               // R13
  const pages = []; for(let i=0;i<items.length;i+=PAGE) pages.push(items.slice(i,i+PAGE));
  return pages.length ? pages : [[]];
}
function prefillZones(){
  const bz = new Set(P.body.stop_zones);
  for(const it of MODULES.zones) if(it.bz && bz.has(it.bz) && !(it.id in P.answers) && condOk(it.c)) P.answers[it.id] = 0;
}
function ynfLabel(){ return P.relationship.format==="mono" ? "opt.ynf.discuss" : "opt.ynf.yes"; }   // R9
function itemTip(it){ if(!it.tip) return null; return `tip.${it.mod}.${it.tip===1?it.s:it.tip}`; }
function poseVars(){
  const r = poseRole(), you = {n:t("poses.you"), g:t("poses.you_gen"), d:t("poses.you_dat")};
  const pf = partnerForms(), pa = {n:pf.nom, g:pf.gen, d:pf.dat};
  const [A,B] = r==="pen" ? [you,pa] : r==="rec" ? [pa,you] : [{n:"А",g:"А",d:"А"},{n:"Б",g:"Б",d:"Б"}];
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  return {A:A.n, A_gen:A.g, A_dat:A.d, B:B.n, B_gen:B.g, B_dat:B.d, _cap:cap};
}
function modHint(it){
  const k = "q."+it.id+".hint"; if(!RU[k]) return "";
  let s = t(k, it.t==="pose" ? poseVars() : undefined);
  return s.charAt(0).toUpperCase()+s.slice(1);
}

    if(it.t==="yn2" && v && typeof v==="object") for(const [k,s] of [["give","a"],["get","b"]]){ if(v[k]===2) y.push(qText(it.id)+" · "+sideLabel(it,s)); else if(v[k]===1) may.push(qText(it.id)+" · "+sideLabel(it,s)); }
  }
  const pills = (y.length||may.length) ? `<div class="pills">${y.map(s=>`<span class="pill y">${esc(s)}</span>`).join("")}${may.map(s=>`<span class="pill m">${esc(s)}</span>`).join("")}</div>` : "";
  const line = (title, arr) => arr.length ? `<p class="small"><b>${esc(title)}:</b> ${esc(arr.join(", "))}</p>` : "";
  if(m==="zones"){
    const z = MODULES.zones.filter(it=>it.t==="zone" && modItemVisible(it));
    parts.push(line(t("mod.res.zones_green"), z.filter(it=>A[it.id]>=3).map(it=>qText(it.id))), line(t("mod.res.zones_stop"), z.filter(it=>A[it.id]===0).map(it=>qText(it.id))));
  }
  if(m==="time"){
    parts.push(line(t("mod.res.formats"), MODULES.time.filter(it=>it.t==="freq" && A[it.id]>=2).map(it=>qText(it.id))));
    for(const s of ["ask","after"]) if(Array.isArray(A["time."+s]) && A["time."+s].length) parts.push(line(qText("time."+s).replace(/\?$/,""), A["time."+s].map(o=>t(`opt.time.${s}.${o}`))));
  }
  if(m==="attr") parts.push(line(t("mod.res.attr"), MODULES.attr.filter(it=>it.t==="chan" && Array.isArray(A[it.id]) && A[it.id].some(x=>x!=="none")).map(it=>`${qText(it.id)} (${A[it.id].map(x=>t("opt.chan."+x).toLowerCase()).join(", ")})`)));
  if(m==="poses"){
    const ps = MODULES.poses.filter(it=>it.t==="pose" && modItemVisible(it));
    parts.push(line(t("mod.res.poses_fav"), ps.filter(it=>A[it.id]==="fav"||A[it.id]==="ok").map(it=>qText(it.id))), line(t("mod.res.poses_want"), ps.filter(it=>A[it.id]==="want").map(it=>qText(it.id))));
  }
  for(const it of items.filter(it=>it.t==="lvl" && typeof A[it.id]==="number")) parts.push(line(t("q."+it.id).replace(/\?$/,""), [t("opt.lvl."+A[it.id]).toLowerCase()]));
  for(const id of ["power.after","anal.comfort"]) if(ITEM[id].mod===m && Array.isArray(A[id]) && A[id].length) parts.push(line(qText(id).replace(/\?$/,""), A[id].map(o=>t(`opt.${id}.${o}`))));
  const tips = [...new Set(items.filter(it=>itemTip(it) && anyYes(it.id)).map(itemTip))];
  if(m==="stim" && A["stim.irritation"]==="yes") tips.push("tip.stim.irritation");
  if(m==="stim" && Array.isArray(A["stim.lube_type"]) && A["stim.lube_type"].some(x=>x==="silicone"||x==="oil")) tips.push("tip.stim.lube_type");
  const tipsHtml = tips.length ? `<p class="small"><b>${t("mod.res.tips")}</b></p><ul class="tips small">${[...new Set(tips)].map(k=>`<li>${t(k)}</li>`).join("")}</ul>` : "";
  const body = pills + parts.join("") + tipsHtml;
  return body || `<p class="muted small">${t("mod.res.none")}</p>`;
}

/* ---------- group wp-group/1: invite, guess, pair comparison (spec 14) ---------- */
const GROUP_KEY = "wp-group/1";
let G = (()=>{ try{ const s = lsGet(GROUP_KEY); const g = s ? JSON.parse(s) : null; return g && g.schema==="wp-group/1" ? g : null; }catch(e){ return null; } })();
let pendingInvite = null, pendingPair = null;    // read from a link, kept in memory until the person decides
function newGroup(role, gid){
  return {schema:"wp-group/1", group_id:gid||uuid(), self_id:uuid(), role,
    members:[], invite:{sent_at:null, opened_at:null, response:null, text_edited:false},
    guess:{a_about_b:{}, b_about_a:{}}, guess_key:null, partner:null, ratings:[], history:[], custom_ideas:[]};

function saveGroup(){ if(!consented()) return; if(G) lsSet(GROUP_KEY, JSON.stringify(G)); else lsDel(GROUP_KEY); }
function ensureGroup(){ if(!G){ G = newGroup("inviter"); G.members.push({profile_id:G.self_id, role:"inviter", joined_at:now()}); } return G; }
const b64e = obj => btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
const b64d = str => JSON.parse(decodeURIComponent(escape(atob(str))));
function appLink(code){ return /^https?:/.test(location.protocol) ? location.origin+location.pathname+"#wp="+code : code; }
function coreDone(){ return !!(P.modules.core?.done || UI.resultSeen); }
function modDone(m){ return !!P.modules[m]?.done && P.modules[m]?.gate!=="skip"; }

// answer shapes allowed in codes
const CODE_RE = /^[a-z0-9_]{1,24}$/;
function validAnswer(id, v){
  if(id.startsWith("core.")) return v===null || v==="na" || (Number.isInteger(v) && v>=0 && v<=5);
  const it = ITEM[id]; if(!it) return false;
  if(v===null) return true;
  switch(it.t){
    case "yn": case "ynf": return [0,1,2].includes(v);
    case "yn2": return !!v && typeof v==="object" && !Array.isArray(v) && Object.keys(v).every(k=>["give","get"].includes(k) && (v[k]===null || [0,1,2].includes(v[k])));
    case "zone": return Number.isInteger(v) && v>=0 && v<=4;
    case "lvl": return [1,2,3].includes(v);
    case "freq": return [0,1,2,3].includes(v);
    case "pose": return ["fav","ok","want","nowant","no"].includes(v);
    case "one": return typeof v==="string" && it.o.includes(v);
    case "chan": return Array.isArray(v) && v.length<=4 && v.every(x=>["look","touch","feel","none"].includes(x));
    case "multi": return Array.isArray(v) && v.length<=it.o.length && v.every(x=>it.o.includes(x));
    case "text": return typeof v==="string" && v.length<=500;
  }
  return false;
}

/* «Слепой» код для партнёра: only Да/Может, no «Нет», no closed brakes, no private items (spec 14.2, 14.5) */
function blindAnswers(){
  const out = {}, A = P.answers, st = stopSet();
  for(const id of [...CORE_IDS, ...EXTRA_IDS]){ if(!WMAP[id] || !itemVisible(id)) continue; if(posAns(A[id])) out[id] = A[id]; }
  for(const m of MODS){
    if(!modDone(m) || modTopicHidden(m)) continue;
    for(const it of MODULES[m]){
      const id = it.id, v = A[id];
      if(NEVER_SHARE.has(id) || !modItemVisible(it,st) || v==null) continue;
      if(it.t==="yn"||it.t==="ynf"){ if(posAns(v)) out[id]=v; }
      else if(it.t==="yn2"){ const o={}; if(posAns(v.give) && colOk(it,"a",st)) o.give=v.give; if(posAns(v.get) && colOk(it,"b",st)) o.get=v.get; if(Object.keys(o).length) out[id]=o; }
      else if(it.t==="pose"){ if(["fav","ok","want"].includes(v)) out[id]=v; }
      else if(it.t==="zone"){ if(v>=3) out[id]=v; }
      else if(it.t==="lvl") out[id]=v;
      else if(it.t==="freq"){ if(v>=2) out[id]=v; }
      else if(it.t==="chan"){ const a=v.filter(x=>x!=="none"); if(a.length) out[id]=a; }
      else if(SHARE_SETS.has(id)) out[id]=v;
    }
  }
  if(modDone("poses")) out["poses.role"] = poseRole();
  return out;
}
function l1Share(){ const l1 = ids("w",1,8).filter(itemVisible); return l1.length ? Math.round(l1.filter(id=>id in P.answers && P.answers[id]!==null).length/l1.length*100)/100 : 0; }
function partnerPayload(){
  ensureGroup();
  const S = computeScales(), sh = {};
  if(P.share_prefs.axes) sh.axes = S.axes;
  if(P.share_prefs.brakes){ const b = {...S.brakes}; delete b.relationship; sh.brakes = b; }   // b13–b15 never go to a partner
  const out = {s:"wp-pair/1", g:G.group_id, m:G.self_id, n:safeName(P.identity.name)||null, core:coreDone(),
    mods:MODS.filter(m=>modDone(m) && !modTopicHidden(m)), a:blindAnswers(), l1:l1Share(), sh};
  if(G.role==="invitee" && G.guess_key && G.reveal_on){ const q = {}; for(const id of revealSel()) q[id] = P.answers[id]; if(Object.keys(q).length) out.q = q; }   // opened only by an explicit choice
  return out;
}
function partnerCode(){ return "WPP1."+b64e(partnerPayload()); }
function cleanPair(o){
  if(!o || o.s!=="wp-pair/1" || typeof o.a!=="object" || Array.isArray(o.a)) throw new Error("schema");
  const a = {};
  for(const [k,v] of Object.entries(o.a)){ if(NEVER_SHARE.has(k) || /^core\.[bgsc]/.test(k)) continue; if(validAnswer(k,v)) a[k]=v; }
  const num01 = v => typeof v==="number" && v>=-1 && v<=5;
  const sh = {};
  if(o.sh?.axes && typeof o.sh.axes==="object") sh.axes = Object.fromEntries(Object.entries(o.sh.axes).filter(([k,v])=>Object.hasOwn(AXES,k) && num01(v)));
  if(o.sh?.brakes && typeof o.sh.brakes==="object") sh.brakes = Object.fromEntries(Object.entries(o.sh.brakes).filter(([k,v])=>Object.hasOwn(BRAKES,k) && k!=="relationship" && num01(v)));
  return {g:typeof o.g==="string"?o.g.slice(0,64):null, m:typeof o.m==="string"?o.m.slice(0,64):null,
    n:safeName(o.n)||null, core:o.core===true,
    mods:Array.isArray(o.mods)?o.mods.filter(m=>MODS.includes(m)):[], a, l1:typeof o.l1==="number" && o.l1>=0 && o.l1<=1 ? o.l1 : 0, sh, q:cleanGuessKey(o.q)};
}
function readCode(raw){
  raw = raw.trim(); const m = raw.match(/#wp=([^\s]+)/); if(m) raw = m[1];
  if(raw.startsWith("WPP1.")) return {kind:"pair", data:cleanPair(b64d(raw.slice(5)))};
  if(raw.startsWith("WPI1.")) return {kind:"invite", data:cleanInvite(b64d(raw.slice(5)))};
  throw new Error("prefix");
}

/* pair math (spec 14.2) */
function pairMatches(){
  const me = blindAnswers(), pa = G.partner.a, out = {sections:[], talk:[], l1:0};
  const both = (m) => m==="core" ? coreDone() && G.partner.core : modDone(m) && G.partner.mods.includes(m);
  const isL1 = id => (WMAP[id]?.lvl===1) || ITEM[id]?.l===1;
  const sec = (key) => { let s = out.sections.find(x=>x.key===key); if(!s){ s={key, yes:[], maybe:[], lines:[], info:[]}; out.sections.push(s); } return s; };
  const cat = (x,y) => x===2 && y===2 ? "yes" : "maybe";
  // core desires
  if(both("core")) for(const id of [...CORE_IDS, ...EXTRA_IDS]) if(WMAP[id] && posAns(me[id]) && posAns(pa[id])){ sec("core")[cat(me[id],pa[id])].push(qText(id)); if(isL1(id)) out.l1++; }
  for(const m of MODS){
    if(!both(m)) continue;
    const s = sec(m);
    for(const it of MODULES[m]){
      const id = it.id, a = me[id], b = pa[id];
      if(it.t==="yn" && posAns(a) && posAns(b)){ s[cat(a,b)].push(qText(id)); if(it.l===1) out.l1++; }
      if(it.t==="ynf" && posAns(a) && posAns(b)) out.talk.push(qText(id));
      if(it.t==="yn2" && a && b){
        const ij = posAns(a.give) && posAns(b.get), ji = posAns(a.get) && posAns(b.give);   // cross: i.give × j.get and i.get × j.give
        if(ij && ji) s.lines.push({c:cat(a.give,b.get)==="yes" && cat(a.get,b.give)==="yes" ? "yes" : "maybe", q:qText(id), r:t("pair.both_ways")});
        else if(ij) s.lines.push({c:cat(a.give,b.get), q:qText(id), r:t("pair."+it.y+".ij")});
        else if(ji) s.lines.push({c:cat(a.get,b.give), q:qText(id), r:t("pair."+it.y+".ji")});
        if((ij||ji) && it.l===1) out.l1++;
      }
      if(it.t==="pose" && a && b){
        const ra = me["poses.role"], rb = pa["poses.role"];
        const iPen = ra==="pen"||ra==="both", iRec = ra==="rec"||ra==="both", pPen = rb==="pen"||rb==="both", pRec = rb==="rec"||rb==="both";
        const o1 = iPen && pRec, o2 = iRec && pPen;
        const r = it.nr ? "" : o1 && o2 ? t("pair.pose.any") : o1 ? t("pair.pen.ij") : o2 ? t("pair.pen.ji") : null;
        if(r!==null) s.lines.push({c:(a==="fav"&&b==="fav")?"yes":"maybe", q:qText(id), r});
      }
      if(it.t==="freq" && a>=2 && b>=2) s.info.push([t("mod.res.formats"), qText(id)]);
      if(it.t==="lvl" && a && b && it.g.some(g=>{ const x=me[m+"."+g], y=pa[m+"."+g]; return x && y && (typeof x==="object" ? (posAns(x.give)&&posAns(y.get))||(posAns(x.get)&&posAns(y.give)) : true); }))
        s.info.push([t("q."+id).replace(/\?$/,""), t("opt.lvl."+Math.min(a,b)).toLowerCase()]);
      if(it.t==="zone" && b>=3) s.info.push([t("pair.zones",{}), qText(id)]);
      if(it.t==="chan" && Array.isArray(b)) s.info.push([t("pair.attr"), qText(id)]);
    }
    for(const id of ["time.ask","time.daytime","anal.comfort"]) if(ITEM[id].mod===m && Array.isArray(me[id]) && Array.isArray(pa[id])){ const x = me[id].filter(o=>pa[id].includes(o) && o!=="unsure"); if(x.length) s.info.push([qText(id).replace(/\?$/,""), x.map(o=>t(`opt.${id}.${o}`)).join(", ")]); }

  const pose = (m, fresh) => {
    let list = poses.filter(p=>!usedPoses.has(p.id));
    if(fresh && list.some(p=>p.fresh)) list = list.filter(p=>p.fresh);
    if(!list.length){ if(!usedPoses.size){ usedPoses.add("any"); add(m, null, {title:t("plan.pose_any"), text:t("plan.pose_any_d")}); } return; }
    const p = list[Math.floor(R()*Math.min(list.length, seed ? 3 : 1))]; usedPoses.add(p.id);
    const sp = format==="quick" ? null : pick("spice");
    add(m, null, {title:t("plan.pose",{p:p.q}), text:[p.r, sp ? t("plan.with")+" "+t("kb."+sp.id+".t").toLowerCase()+(ideaRole(sp) ? " ("+ideaRole(sp).toLowerCase()+")" : "")+". "+t("kb."+sp.id+".d") : ""].filter(Boolean).join(". "), rateId:p.id, spice:sp});
  };
  const idea = (m, k, label) => k && add(m ?? k.m, k, {label});
  if(format==="weekend") add(0, null, {when:"plan.when.days", title:t("plan.agree"), text:t("plan.agree_d")});
  if(format==="evening" || format==="weekend"){ const p = pick("prep"); if(p) idea(0, p); if(steps.length) steps.at(-1).when ||= "plan.when.day"; }
  if(format==="weekend") idea(0, pick("event"));
  if(format!=="quick") idea(0, pick("set"));
  if(format==="quick") add(2, null, {title:t("plan.warm"), text:t("plan.warm_quick")});   // 10 minutes: no room for a separate warm-up idea
  else { const w = pick("warm", k=>format!=="regular" || k.m<=15); if(w) idea(null, w); else add(10, null, {title:t("plan.warm"), text:t("plan.warm_any")}); }
  if(format==="evening" || format==="weekend"){ const w2 = pick("warm", k=>k.m<=10); if(w2) idea(null, w2); idea(null, pick("scene", k=>k.id!=="scene.morning" && (format!=="evening" || k.id!=="scene.slow"))); }
  pose(format==="quick" ? 6 : 10, false);
  if(format!=="quick") pose(10, true);
  const f = format==="quick" ? null : pick("fin");
  if(f) idea(null, f); else if(format!=="quick") add(5, null, {title:t("plan.fin"), text:t("plan.fin_any")});
  const pw = steps.some(s=>s.k?.pw || s.spice?.pw);
  add(format==="quick" ? 2 : format==="regular" ? 5 : 15, null, {title:t("plan.after"), text:afterText(pw)});
  if(format==="weekend") add(0, null, {when:"plan.when.morning", title:t("plan.morning"), text:t("plan.morning_d")});
  let total = 0;
  for(const s of steps){
    if(s.k){ s.title = (s.label ? s.label+": " : "") + t("kb."+s.k.id+".t"); s.text = [t("kb."+s.k.id+".d"), ideaRole(s.k)].filter(Boolean).join(" "); s.rateId = s.k.id;
      s.safe = [s.k.s, s.spice?.s].filter(Boolean); s.lvl = s.k.lvl; }
    else if(s.spice){ s.safe = [s.spice.s].filter(Boolean); s.lvl = s.spice.lvl; }
    if(s.when || s.k?.k==="prep" || s.k?.k==="event" || s.k?.k==="set") s.time = s.when ? t(s.when) : s.k?.k==="prep" ? t("plan.when.day") : s.k?.k==="event" ? t("plan.when.event") : t("plan.when.before");
    else { s.time = Math.floor(total/60)+":"+String(total%60).padStart(2,"0"); total += s.m; }
  }
  return {steps, total, pw, format};
}

function partnerQ(){ const q = G?.partner?.q; return q && Object.keys(q).length ? q : null; }
function myGuessIds(){ const q = partnerQ(); if(q) return Object.keys(q); return (G?.guess_ids||[]).length ? G.guess_ids : inviteSel(); }

      const raw = document.getElementById("import-ta").value.trim(), msg=document.getElementById("import-msg");
      try{ pendingImport = cleanProfile(JSON.parse(decodeURIComponent(escape(atob(raw.replace(/^WP1\./,"")))))); }
      catch(err){ pendingImport = null; msg.textContent = t("set.import_bad"); return; }
      return rerender();
    }
    case "importyes": {
      if(!pendingImport) return;
      pendingImport.settings.pin = P.settings.pin;
      pendingImport.settings.dismissed_hints = P.settings.dismissed_hints;
      pendingImport.consent = P.consent;   // consent was given on this device, not taken from the code
      P = pendingImport; pendingImport = null;
      UI.resultSeen = CORE_IDS.some(id=>id in P.answers) || !!P.modules.core?.done; save(); toast(t("set.import_ok")); return rerender();
    }
    case "importno": pendingImport = null; return rerender();
    /* modules */
    case "openmod": {
      const m = b.dataset.m; UI.mod = m; UI.modPage = 0; UI.mi = {...(UI.mi||{}), [m+":0"]:0};
      if(m==="zones") prefillZones();
      if(!P.modules[m]?.gate || (P.modules[m].gate==="skip" && !b.dataset.edit)) return go("modgate");
      if(b.dataset.edit && P.modules[m].gate==="skip") return go("modgate");
      return go("mod");
    }
    case "gate": {
      const m = UI.mod, k = b.dataset.k;
      P.modules[m] = {...(P.modules[m]||{}), gate:k, at:now()};
      if(k==="skip"){ P.modules[m].done = false; save(); return go("mods"); }                       // R12
      UI.modPage = 0; return go("mod");
    }
    case "mans": {
      const id=b.dataset.id, side=b.dataset.side, raw=b.dataset.val, val = b.dataset.kind==="s" || !/^\d$/.test(raw) ? raw : Number(raw);
      if(side){ const k = side==="a"?"give":"get"; const cur = (P.answers[id] && typeof P.answers[id]==="object") ? {...P.answers[id]} : {};
        cur[k] = cur[k]===val ? null : val; if(cur.give==null && cur.get==null) delete P.answers[id]; else P.answers[id] = cur; }
      else if(P.answers[id]===val && UI.screen!=="mod") delete P.answers[id]; else P.answers[id]=val;
      save();
      if(UI.screen==="mod"){ const it = ITEM[id];
        if(side){ const sides=["a","b"].filter(x=>colOk(it,x,stopSet())), cur=P.answers[id]||{}; if(sides.every(x=>cur[x==="a"?"give":"get"]!=null)) return setTimeout(mAdvance, 200); return rerender(); }
        if(M_AUTO.has(it.t) && !(id==="power.stopword" && val==="what")) return setTimeout(mAdvance, b.dataset.one ? 0 : 200);
      }
      return rerender();
    }
    case "mmulti": {
      const id=b.dataset.id, val=b.dataset.val, ex=b.dataset.ex?b.dataset.ex.split(","):[];
      let arr = Array.isArray(P.answers[id]) ? [...P.answers[id]] : [];
      if(arr.includes(val)) arr = arr.filter(x=>x!==val); else arr = ex.includes(val) ? [val] : [...arr.filter(x=>!ex.includes(x)), val];
      if(arr.length) P.answers[id] = arr; else delete P.answers[id];
      save(); return rerender();
    }
    case "modintro": UI.modIntroSeen[UI.mod] = true; UI.mi[UI.mod+":0"] = 0; save(); render(); window.scrollTo(0,0); return;
    case "mstep": return mAdvance();
    case "mback": return mBack();
    case "deckgo": { UI.deck ||= {}; UI.deck[b.dataset.key] = Math.max(0, Number(b.dataset.i)); save(); render(); window.scrollTo(0,0); return; }
    case "storygo": { const n = Number(b.dataset.i); if(n<0) return; UI.storyI = n; if(b.dataset.open) return go("story"); save(); return render(); }
    case "modnext": {
      if(b.dataset.whole) return modNextPage();
      const pages = modPages(UI.mod);
      if(P.modules[UI.mod]?.gate==="peek" && !UI.peekMore?.[UI.mod]){ save(); return go("mods"); }      // R13: a peek is not a finished module
      if((UI.modPage||0) < pages.length-1){ UI.modPage = (UI.modPage||0)+1; return go("mod"); }
      P.modules[UI.mod] = {...P.modules[UI.mod], done:true, at:now()}; return go("modres");
    }
    case "modback": if((UI.modPage||0)>0){ UI.modPage--; return go("mod"); } return go("modgate");
    case "peekmore": UI.peekMore = {...(UI.peekMore||{}), [UI.mod]:true}; UI.modPage = 1; return go("mod");
    /* invite and guess */
    case "invlater": pendingInvite = null; return go("later");
    case "invaccept": if(pendingInvite){ startAsInvitee(pendingInvite); return go("guess"); } return go("welcome");
    case "invsel": { const id=b.dataset.id, s=inviteSel(); UI.inviteSel = s.includes(id) ? s.filter(x=>x!==id) : s.length>=15 ? s : [...s,id]; save(); return rerender(); }
    case "invcopy": {
      const text = (document.getElementById("inv-ta")?.value || inviteText()).trim() + "\n" + inviteLink();
      G.invite.sent_at = now(); G.guess_ids = inviteSel(); G.invite.text_edited = UI.inviteText!=null && UI.inviteText!==t("inv.text"); saveGroup();
      try{ await navigator.clipboard.writeText(text); toast(t("inv.copied")); }catch(err){ toast("Скопируй вручную"); }
      return rerender();
    }
    case "guess": { const id=b.dataset.id, v=b.dataset.val==="x"?null:Number(b.dataset.val);
      if(b.dataset.deck){ G.guess.b_about_a[id] = v; saveGroup(); UI.deck[b.dataset.deck] = (UI.deck[b.dataset.deck]||0)+1; save(); render(); window.scrollTo(0,0); return; }
      G.guess.b_about_a[id] = G.guess.b_about_a[id]===v ? undefined : v; saveGroup(); return rerender(); }
    case "guessopen": UI.guessOpen = {...(UI.guessOpen||{}), [b.dataset.id]:true}; return rerender();
    /* pair */
    case "pairimport": {
      const msg = document.getElementById("pimp-msg");
      try{ const r = readCode(document.getElementById("pimp-ta").value);
        if(r.kind!=="pair") throw new Error("kind");
        if(G && r.data.m && r.data.m===G.self_id){ msg.textContent = t("pair.self"); return; }
        pendingPair = r.data; }
      catch(err){ pendingPair = null; msg.textContent = t("pair.bad"); return; }
      return rerender();
    }
    case "pairyes": if(pendingPair){ addPartner(pendingPair); pendingPair = null; } return rerender();
    case "pairno": pendingPair = null; return rerender();
    case "rate": { const id=b.dataset.id, v=b.dataset.val, cur=ideaRatings()[id]; G.ratings = (G.ratings||[]).filter(r=>r.id!==id); if(cur!==v) G.ratings.push({id, v}); saveGroup(); return rerender(); }
    case "planfmt": UI.planFormat = b.dataset.f; UI.planSeed = 0; UI.planCopyAsk = false; save(); return rerender();
    case "planagain": UI.planSeed = (UI.planSeed||0)+1; return rerender();
    case "planrate": UI.planRate = !UI.planRate; return rerender();
    case "plancopy": { if(!UI.planCopyAsk){ UI.planCopyAsk = true; return rerender(); }
      const F = planFormats(), fmt = UI.planFormat && PLAN_FORMATS.includes(UI.planFormat) ? UI.planFormat : (F.common?.[0] || "regular");
      neutralPartner = true; let text; try{ text = planText(buildPlan(fmt, UI.planSeed||0)); } finally { neutralPartner = false; }
      UI.planCopyAsk = false;
      try{ await navigator.clipboard.writeText(text); toast(t("plan.copied")); }catch(err){ toast(t("plan.copy_fail")); } return rerender(); }
    case "plancopyno": UI.planCopyAsk = false; return rerender();
    case "myguess": { if(G.guess.a_seen) return; const id=b.dataset.id, v=b.dataset.val==="x"?null:Number(b.dataset.val);
      if(b.dataset.deck){ G.guess.a_about_b[id] = v; saveGroup(); UI.deck[b.dataset.deck] = (UI.deck[b.dataset.deck]||0)+1; save(); render(); window.scrollTo(0,0); return; }
      G.guess.a_about_b[id] = G.guess.a_about_b[id]===v ? undefined : v; saveGroup(); return rerender(); }
    case "myguessdone": if(partnerQ()){ G.guess.a_seen = true; saveGroup(); return go("myguessres"); } return rerender();
    case "revsel": { const id=b.dataset.id, s=revealSel(); G.reveal_sel = s.includes(id) ? s.filter(x=>x!==id) : s.length>=15 ? s : [...s,id]; if(!G.reveal_sel.length) G.reveal_on = false; saveGroup(); return rerender(); }
    case "revon": G.reveal_on = !G.reveal_on; saveGroup(); return rerender();
    case "pairdel": if(G){ G.partner = null; G.guess.a_seen = false; G.ratings = []; G.members = G.members.filter(x=>x.profile_id===G.self_id); saveGroup(); } toast(t("pair.deleted")); return rerender();
  }
});

(function readLink(){
  const m = location.hash.match(/#wp=([^&\s]+)/); if(!m) return;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  let r; try{ r = readCode(m[1]); }catch(e){ return; }
  if(r.kind==="invite"){
    if(G && G.group_id===r.data.g && G.role==="inviter"){ setTimeout(()=>toast(t("pair.invite_own")),0); return; }
    pendingInvite = r.data; UI.screen = "welcome";
  } else if(r.kind==="pair"){
    pendingPair = r.data; if(consented()) UI.screen = "pair";
  }
})();
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http") && document.querySelector('link[rel="manifest"]')){
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadSW && !window._swReloaded){ window._swReloaded = true; location.reload(); } });   // a new version took over: show it
  if(!/[?&]reset\b/.test(location.search)) navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
}
</script>
